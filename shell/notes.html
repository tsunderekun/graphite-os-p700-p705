        <path d="M6 6 L18 18 M18 6 L6 18"/>

  <div class="notearea">
    <h1>План сборки системы</h1>
    <div>1. Собрать ядро 3.4 с драйвером fbdev для msm7227a<br>
    2. Отключить лишние службы для экономии памяти<br>
    3. Настроить запуск графитовой оболочки через xinit<br>
    4. Проверить раскладку ввода в терминале <span class="caret"></span></div>
  </div>

  <div class="kb" id="kb"></div>

  <nav class="dock">

    </a>
    <a href="#" title="Браузер">
