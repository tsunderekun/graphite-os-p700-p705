<!doctype html>
<html lang="ru">
<head>

<title>graphite shell — home</title>

      <a class="tile" href="#">

          <rect x="16" y="13" width="6" height="6"/><rect x="28" y="21" width="6" height="6"/><rect x="20" y="29" width="6" height="6"/>

      <a class="tile" href="#">
