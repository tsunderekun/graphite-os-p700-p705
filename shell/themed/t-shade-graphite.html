<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>metro — shade</title>
<link rel="stylesheet" href="metro-graphite.css">
</head>
<body style="background:#101419 url('../tex/laid-graphite.png') 0 0 / 384px 384px repeat">
  <div class="shade-dim"></div>
  <div class="shade">
    <div class="sh-top">
      <span class="sh-time">14:35</span>
      <span class="sh-date">Пн, 24 ноя</span>
      <a href="m-shsettings.html" aria-label="Настройки">
        <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h16"/><rect x="7" y="4" width="4" height="4"/><rect x="13" y="10" width="4" height="4"/><rect x="9" y="16" width="4" height="4"/></svg>
      </a>
    </div>

    <div class="qtiles">
      <div class="qtile on" data-act="wifi"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6c5.5-5 14.5-5 20 0"/><path d="M5 9.5c4-3.5 10-3.5 14 0"/><path d="M8 13c2.5-2 5.5-2 8 0"/><circle cx="12" cy="16.4" r="1.2" fill="currentColor" stroke="none"/></svg><span>Wi-Fi</span></div>
      <div class="qtile" data-act="bt"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 4l8 8-8 8V4z"/><path d="M8 12h8"/></svg><span>Bluetooth</span></div>
      <div class="qtile on" data-act="sound"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8c2 2 2 6 0 8"/></svg><span>Звук</span></div>
      <div class="qtile on" data-act="bright"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg><span>Яркость</span></div>
      <div class="qtile on" data-act="keys"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="7" width="20" height="11"/><path d="M6 10h1M10 10h1M14 10h1M18 10h1M6 13h1M10 13h1M14 13h1M18 13h1"/></svg><span>Клавиши</span></div>
      <div class="qtile" data-act="player"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 17V8l8-2v9"/><circle cx="8" cy="17" r="2"/><circle cx="16" cy="15" r="2"/></svg><span>Плеер</span></div>
      <div class="qtile" data-act="lock"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="11" width="14" height="9"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>Лок</span></div>
      <div class="qtile" data-act="power"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v8"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg><span>Питание</span></div>
    </div>

    <div class="slider" style="top:224px">
      <span class="lab">ГРОМКОСТЬ</span><span class="val">60%</span>
      <div class="bar"><i style="width:60%"></i></div><div class="knob" style="left:261px"></div>
    </div>
    <div class="slider" style="top:272px">
      <span class="lab">ЯРКОСТЬ</span><span class="val">70%</span>
      <div class="bar"><i style="width:70%"></i></div><div class="knob" style="left:306px"></div>
    </div>

    <div class="notif" data-act="np" style="top:326px">
      <div class="nt">Звезда по имени Солнце</div><div class="ns">Кино · играет</div><div class="ntime">сейчас</div>
    </div>
    <div class="notif" style="top:390px">
      <div class="nt">Wi-Fi подключён</div><div class="ns">Home-Wi-Fi · <phone-ip></div><div class="ntime">5 мин</div>
    </div>
    <div class="sh-handle"></div>
  </div>
  <script src="../metro.js"></script>
</body>
</html>
