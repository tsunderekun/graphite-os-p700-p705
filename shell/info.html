<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>graphite shell — info</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="sbar">
    <button class="sbtn left" aria-label="Назад">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M15 6 L7 12 L15 18"/>
      </svg>
    </button>
    <div class="stitle">ИНФО</div>
    <button class="sbtn right" aria-label="Настройки">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M4 6h16M4 12h16M4 18h16"/>
        <rect x="7" y="4" width="4" height="4"/><rect x="13" y="10" width="4" height="4"/><rect x="9" y="16" width="4" height="4"/>
      </svg>
    </button>
  </header>

  <div class="info-thumb">
    <svg class="icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M20 33V14l14-4v20"/>
      <circle cx="16" cy="33" r="4"/><circle cx="30" cy="30" r="4"/>
    </svg>
  </div>
  <div class="info-title">Звезда по имени Солнце</div>
  <div class="info-sub">Кино</div>
  <div class="info-sub2">Группа крови</div>

  <div class="info-line" style="top:200px"></div>

  <div class="info-row" style="top:214px">
    <div class="info-label">ЖАНР</div><div class="info-val">Рок</div>
  </div>
  <div class="info-row" style="top:256px">
    <div class="info-label">ДАТА</div><div class="info-val">1988</div>
  </div>
  <div class="info-row" style="top:298px">
    <div class="info-label">ТРЕК</div><div class="info-val">2 / 8</div>
  </div>
  <div class="info-row" style="top:340px">
    <div class="info-label">ДЛИТЕЛЬНОСТЬ</div><div class="info-val">3:48</div>
  </div>
  <div class="info-row" style="top:382px">
    <div class="info-label">ФОРМАТ</div><div class="info-val">44,1 кГц · stereo</div>
  </div>
  <div class="info-row" style="top:424px">
    <div class="info-label">БИТРЕЙТ</div><div class="info-val">320 кбит/с</div>
  </div>

  <div class="info-line" style="top:476px"></div>

  <div class="info-label" style="left:24px;top:500px">ФАЙЛ</div>
  <div class="infoline" style="left:24px;top:520px;width:432px">Music/Кино/Группа крови/01 — Звезда по</div>
  <div class="infoline" style="left:24px;top:540px;width:432px">имени Солнце.mp3</div>
  <script src="shell.js"></script>
</body>
</html>
