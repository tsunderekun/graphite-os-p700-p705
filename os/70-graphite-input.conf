# Handset/headset keys: POWER, END, MEDIA and the second copy of VOL±.
# event0 (touch panel) already carries Back/Menu/Home; event1 carries Home and
# VOL±. Without this file KEY_POWER never reaches X.
Section "InputClass"
    Identifier "graphite handset keys"
    MatchDevicePath "/dev/input/event5"
    Driver "evdev"
EndSection
